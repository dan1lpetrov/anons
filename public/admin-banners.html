<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Anons — Банери</title>
<script>(function(){try{var t=localStorage.getItem('anons-admin-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/admin.css" />
</head>
<body>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-screen__box">
    <h1>Anons Admin</h1>
    <p class="hint">Потрібен вхід через Google-акаунт адміністратора.</p>
    <a class="button primary" href="/admin">Перейти до входу</a>
  </div>
</div>

<div id="app" class="admin-shell hidden">
  <div id="nav"></div>
  <main class="admin-content">
    <div class="admin-content__inner admin-content__inner--medium">
      <div class="row" style="justify-content: space-between;">
        <h1>Банери на головній</h1>
        <button type="button" class="primary" id="addBannerBtn">+ Додати банер</button>
      </div>
      <p class="hint">Кожен банер веде на категорію, активний розпродаж або зовнішнє посилання. Перетягни за ручку зліва, щоб змінити порядок у каруселі.</p>

      <div id="bannerList" class="item-list"></div>
      <div id="listStatus" class="status"></div>
    </div>
  </main>
</div>

<script src="/assets/admin.js"></script>
<script>
  const bannerList = document.getElementById('bannerList');
  const listStatus = document.getElementById('listStatus');

  // Mirrors the SaleId brand enum from src/types — see admin-upload.html's SALES map.
  const SALE_NAMES = { nike: 'Nike', adidas: 'Adidas', puma: 'Puma' };

  // Mirrors src/data/categories.ts's CATEGORY_LABELS — categoryId isn't a
  // closed enum, so unknown ids just fall back to showing the raw id.
  const CATEGORY_LABELS = {
    shoes: 'Взуття',
    clothing: 'Одяг',
    accessories: 'Аксесуари',
    tshirts: 'Футболки',
    pants: 'Штани',
    jackets: 'Куртки',
  };

  let activeSales = []; // [{ id: saleId, name }]
  let availableCategories = []; // [categoryId]
  let banners = []; // client-side shape: { id, image, title, subtitle, active, sortOrder, linkType, linkCategoryId, linkSaleId, linkUrl }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function destSummary(b) {
    if (b.linkType === 'category') return `категорія → ${CATEGORY_LABELS[b.linkCategoryId] || b.linkCategoryId || '—'}`;
    if (b.linkType === 'sale') return `розпродаж → ${SALE_NAMES[b.linkSaleId] || b.linkSaleId || '—'}`;
    return `URL → ${b.linkUrl || '—'}`;
  }

  function fromApi(row) {
    let linkType = 'category';
    if (row.linkUrl) linkType = 'url';
    else if (row.linkSaleId) linkType = 'sale';
    return {
      id: row.id,
      image: row.imageUrl || '',
      title: row.title || '',
      subtitle: row.subtitle || '',
      active: !!row.active,
      sortOrder: row.sortOrder ?? 0,
      linkType,
      linkCategoryId: row.linkCategoryId || (availableCategories[0] || ''),
      linkSaleId: row.linkSaleId || (activeSales[0] && activeSales[0].id) || '',
      linkUrl: row.linkUrl || '',
    };
  }

  function toApiPayload(b) {
    return {
      ...(typeof b.id === 'number' ? { id: b.id } : {}),
      imageUrl: b.image.trim(),
      title: b.title.trim(),
      subtitle: b.subtitle.trim(),
      linkCategoryId: b.linkType === 'category' ? b.linkCategoryId || null : null,
      linkSaleId: b.linkType === 'sale' ? b.linkSaleId || null : null,
      linkUrl: b.linkType === 'url' ? b.linkUrl.trim() : null,
      sortOrder: b.sortOrder,
      active: b.active,
    };
  }

  async function loadOptions() {
    try {
      const res = await fetch('/api/sales', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const all = await res.json();
      // A brand can have several active campaigns at once — a banner links to the
      // brand, not a specific campaign, so dedupe to one option per saleId.
      activeSales = [...new Map(all.filter((s) => s.active).map((s) => [s.saleId, s])).values()].map((s) => ({
        id: s.saleId,
        name: SALE_NAMES[s.saleId] || s.saleId,
      }));
    } catch {
      activeSales = [];
    }

    try {
      const res = await fetch('/api/products', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const products = await res.json();
      const seen = new Set();
      availableCategories = [];
      products.forEach((p) => {
        if (p.categoryId && !seen.has(p.categoryId)) {
          seen.add(p.categoryId);
          availableCategories.push(p.categoryId);
        }
      });
      availableCategories.sort((a, b) => (CATEGORY_LABELS[a] || a).localeCompare(CATEGORY_LABELS[b] || b, 'uk'));
    } catch {
      availableCategories = [];
    }
  }

  async function loadBanners() {
    AdminShared.setStatus(listStatus, 'pending', 'Завантаження...');
    try {
      const res = await fetch('/api/banners?all=1', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      const rows = await res.json();
      banners = rows.map(fromApi);
      renderBanners();
      listStatus.className = 'status';
    } catch (err) {
      AdminShared.setStatus(listStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  // Carousel order = position in this array (drag-and-drop reorders it directly). Sort is
  // stable, so a plain active-first partition keeps everyone's relative order within their own
  // group — inactive banners just sink below the active ones, they don't lose their place among
  // themselves.
  function renderBanners() {
    banners.sort((a, b) => (a.active === b.active ? 0 : a.active ? -1 : 1));
    bannerList.innerHTML = '';
    if (banners.length === 0) {
      bannerList.innerHTML = `<div class="empty-state">${AdminShared.icon('inbox', 32)}<p>Ще немає жодного банера.</p></div>`;
      return;
    }
    let dividerShown = false;
    banners.forEach((b, i) => {
      if (!b.active && !dividerShown) {
        dividerShown = true;
        const divider = document.createElement('div');
        divider.className = 'list-divider';
        divider.textContent = 'Неактивні';
        bannerList.appendChild(divider);
      }
      bannerList.appendChild(buildBannerCard(b, i));
    });
  }

  // Persists the current visual order: reassigns sortOrder to match array position and pushes
  // only the banners whose stored sortOrder actually changed (a plain rename elsewhere in the
  // list shouldn't cause N unrelated writes).
  async function persistOrder() {
    const updates = [];
    banners.forEach((b, i) => {
      if (b.sortOrder !== i) {
        b.sortOrder = i;
        updates.push(b);
      }
    });
    if (updates.length === 0) return;
    AdminShared.setStatus(listStatus, 'pending', 'Зберігаю порядок...');
    try {
      await Promise.all(
        updates.map((b) =>
          fetch('/api/banners', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(toApiPayload(b)),
          }),
        ),
      );
      listStatus.className = 'status';
    } catch (err) {
      AdminShared.setStatus(listStatus, 'err', 'Не вдалося зберегти порядок: ' + err.message);
    }
  }

  // --- Drag-and-drop reorder ---
  // The handle is the only draggable element (so clicks on inputs/buttons elsewhere in the
  // card still work), but its drag *image* is set to the whole row so the banner itself looks
  // like it's being picked up, not just the grip icon. A single shared indicator line tracks
  // exactly where the drop would land — above or below whichever half of a card the pointer is
  // over — so "drop on a banner" always means "drop before/after it," never "swap with it."
  let draggedIndex = null;
  let dropTargetIndex = null;
  let dropBefore = true;
  let dropIndicatorEl = null;

  function dropIndicator() {
    if (!dropIndicatorEl) {
      dropIndicatorEl = document.createElement('div');
      dropIndicatorEl.className = 'drop-indicator';
    }
    return dropIndicatorEl;
  }

  function cleanupDrag() {
    if (dropIndicatorEl && dropIndicatorEl.parentNode) dropIndicatorEl.parentNode.removeChild(dropIndicatorEl);
    draggedIndex = null;
    dropTargetIndex = null;
  }

  function finishDrag() {
    if (draggedIndex === null || dropTargetIndex === null) {
      cleanupDrag();
      return;
    }
    let target = dropTargetIndex + (dropBefore ? 0 : 1);
    if (draggedIndex < target) target -= 1; // removing the dragged item shifts everything after it down by one
    if (target !== draggedIndex) {
      const [moved] = banners.splice(draggedIndex, 1);
      banners.splice(target, 0, moved);
    }
    cleanupDrag();
    renderBanners();
    persistOrder();
  }

  // Per-card dragover/drop (in wireDrag) only fires while the pointer is over a card's own box,
  // and stops there via stopPropagation. Dragging past the top of the first card or below the
  // bottom of the last one puts the pointer over empty space outside #bannerList entirely (the
  // page header, the hint text, blank space below the list, ...) — a listener on #bannerList
  // itself would miss that, since dragover only fires on whatever element is actually under the
  // pointer. Listening on the document catches it no matter how far the pointer strays.
  document.addEventListener('dragover', (e) => {
    if (draggedIndex === null) return;
    e.preventDefault();
    const cards = [...bannerList.querySelectorAll('.item-card:not([data-new])')];
    if (cards.length === 0) return;
    const firstRect = cards[0].getBoundingClientRect();
    const lastRect = cards[cards.length - 1].getBoundingClientRect();
    if (e.clientY < firstRect.top) {
      dropTargetIndex = 0;
      dropBefore = true;
      bannerList.insertBefore(dropIndicator(), cards[0]);
    } else if (e.clientY > lastRect.bottom) {
      dropTargetIndex = banners.length - 1;
      dropBefore = false;
      bannerList.appendChild(dropIndicator());
    }
  });
  document.addEventListener('drop', (e) => {
    if (draggedIndex === null) return;
    e.preventDefault();
    finishDrag();
  });

  function wireDrag(card, handle, index) {
    const row = card.querySelector('.item-card__row');

    handle.addEventListener('dragstart', (e) => {
      draggedIndex = index;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(index));
      const rect = row.getBoundingClientRect();
      e.dataTransfer.setDragImage(row, e.clientX - rect.left, e.clientY - rect.top);
    });
    handle.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      cleanupDrag();
    });

    card.addEventListener('dragover', (e) => {
      if (draggedIndex === null) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = card.getBoundingClientRect();
      dropBefore = e.clientY - rect.top < rect.height / 2;
      dropTargetIndex = index;
      const indicator = dropIndicator();
      card.parentNode.insertBefore(indicator, dropBefore ? card : card.nextSibling);
    });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      finishDrag();
    });
  }

  function updatePreview(card) {
    const img = card.querySelector('.f-image').value.trim();
    const title = card.querySelector('.f-title').value.trim();
    const subtitle = card.querySelector('.f-subtitle').value.trim();
    const preview = card.querySelector('.banner-preview');
    preview.querySelector('.banner-preview__img').src = img;
    preview.querySelector('.banner-preview__img').classList.toggle('hidden', !img);
    preview.querySelector('.banner-preview__empty').classList.toggle('hidden', !!img);
    preview.querySelector('.banner-preview__title').textContent = title || 'Заголовок банера';
    const subtitleEl = preview.querySelector('.banner-preview__subtitle');
    subtitleEl.textContent = subtitle;
    subtitleEl.classList.toggle('hidden', !subtitle);
  }

  function categoryOptionsHtml(selected) {
    if (availableCategories.length === 0) return `<option value="">Немає доступних категорій</option>`;
    return availableCategories.map((id) => `<option value="${id}" ${selected === id ? 'selected' : ''}>${CATEGORY_LABELS[id] || id}</option>`).join('');
  }

  function saleOptionsHtml(selected) {
    if (activeSales.length === 0) return `<option value="">Немає активних розпродажів</option>`;
    return activeSales.map((s) => `<option value="${s.id}" ${selected === s.id ? 'selected' : ''}>${s.name}</option>`).join('');
  }

  function buildBannerCard(b, index, isNew) {
    const card = document.createElement('div');
    card.className = 'item-card';
    if (isNew) card.dataset.new = 'true'; // excluded from drag targeting — it isn't in `banners` yet
    card.innerHTML = `
      <div class="item-card__row">
        <span class="drag-handle" draggable="true" title="Перетягни, щоб змінити порядок">${AdminShared.icon('grip', 14)}</span>
        <img class="item-thumb" src="${escapeHtml(b.image)}" alt="" />
        <div class="item-card__identity">
          <span class="item-card__name">${escapeHtml(b.title) || '(без заголовка)'}</span>
          <span class="item-card__subtitle">${escapeHtml(destSummary(b))}</span>
        </div>
        <span class="status-dot ${b.active ? 'active' : 'stopped'}" title="${b.active ? 'Активний' : 'Вимкнений'}"></span>
        <div class="item-card__actions">
          <button type="button" class="icon-btn edit-toggle" title="Редагувати">${AdminShared.icon('pencil', 14)}</button>
          <button type="button" class="icon-btn danger delete-toggle" title="Видалити">${AdminShared.icon('trash', 14)}</button>
        </div>
      </div>
      <div class="item-card__panel item-card__edit">
        <div class="field-grid item-form-grid">
          <div class="field field-span-4">
            <label>Картинка банера</label>
            <div class="image-picker">
              <img class="image-picker__preview" src="${escapeHtml(b.image)}" alt="" />
              <div class="image-picker__controls">
                <input type="file" class="f-image-file" accept="image/*" />
                <input type="text" class="f-image" value="${escapeHtml(b.image)}" placeholder="https://... (або завантаж файл вище)" />
                <div class="status f-image-status"></div>
              </div>
            </div>
          </div>
          <div class="field field-span-2">
            <label>Заголовок</label>
            <input type="text" class="f-title" value="${escapeHtml(b.title)}" placeholder="SS24 COMING SOON" />
          </div>
          <div class="field field-span-2">
            <label>Підзаголовок</label>
            <input type="text" class="f-subtitle" value="${escapeHtml(b.subtitle)}" placeholder="Дивитись" />
          </div>
          <div class="field field-span-4">
            <label>Прев'ю на сайті</label>
            <div class="banner-preview">
              <img class="banner-preview__img ${b.image ? '' : 'hidden'}" src="${escapeHtml(b.image)}" alt="" />
              <div class="banner-preview__empty ${b.image ? 'hidden' : ''}">без картинки</div>
              <div class="banner-preview__overlay">
                <span class="banner-preview__title">${escapeHtml(b.title) || 'Заголовок банера'}</span>
                <span class="banner-preview__subtitle ${b.subtitle ? '' : 'hidden'}">${escapeHtml(b.subtitle)}</span>
              </div>
            </div>
          </div>
          <div class="field field-span-4">
            <label>Куди веде банер</label>
            <div class="segmented f-link-type">
              <button type="button" data-val="category" class="${b.linkType === 'category' ? 'active' : ''}">Категорія</button>
              <button type="button" data-val="sale" class="${b.linkType === 'sale' ? 'active' : ''}">Розпродаж</button>
              <button type="button" data-val="url" class="${b.linkType === 'url' ? 'active' : ''}">URL</button>
            </div>
          </div>
          <div class="field field-span-4 dest-field dest-category ${b.linkType !== 'category' ? 'hidden' : ''}">
            <label>Категорія</label>
            <select class="f-category">${categoryOptionsHtml(b.linkCategoryId)}</select>
          </div>
          <div class="field field-span-4 dest-field dest-sale ${b.linkType !== 'sale' ? 'hidden' : ''}">
            <label>Розпродаж</label>
            <select class="f-sale">${saleOptionsHtml(b.linkSaleId)}</select>
          </div>
          <div class="field field-span-4 dest-field dest-url ${b.linkType !== 'url' ? 'hidden' : ''}">
            <label>URL</label>
            <input type="text" class="f-url" value="${escapeHtml(b.linkUrl)}" placeholder="https://..." />
          </div>
          <div class="field field-span-2">
            <label>Активний</label>
            <div class="status-toggle">
              <label class="switch">
                <input type="checkbox" class="f-active" ${b.active ? 'checked' : ''} />
                <span class="switch-track"></span>
              </label>
              <span class="status-toggle__word ${b.active ? 'active-text' : 'paused-text'}">${b.active ? 'Показується' : 'Вимкнено'}</span>
            </div>
          </div>
        </div>
        <div class="item-form-footer">
          <button type="button" class="danger delete-toggle">Видалити банер</button>
          <div class="row">
            <button type="button" class="secondary cancel-edit-btn">Скасувати</button>
            <button type="button" class="primary save-edit-btn">Зберегти</button>
          </div>
        </div>
      </div>
      <div class="item-card__panel item-card__confirm">
        <span class="item-card__confirm-text">Видалити банер <b>«${escapeHtml(b.title) || '(без заголовка)'}»</b>?</span>
        <div class="item-card__confirm-actions">
          <button type="button" class="secondary cancel-delete-btn">Скасувати</button>
          <button type="button" class="danger confirm-delete-btn">Так, видалити</button>
        </div>
      </div>
    `;

    const editIconBtn = card.querySelector('.item-card__actions .edit-toggle');
    const editToggles = card.querySelectorAll('.edit-toggle');
    const deleteToggles = card.querySelectorAll('.delete-toggle');
    const cancelEditBtn = card.querySelector('.cancel-edit-btn');
    const saveBtn = card.querySelector('.save-edit-btn');
    const cancelDeleteBtn = card.querySelector('.cancel-delete-btn');
    const confirmDeleteBtn = card.querySelector('.confirm-delete-btn');
    const linkTypeSeg = card.querySelector('.f-link-type');
    const activeInput = card.querySelector('.f-active');
    const activeWord = card.querySelector('.status-toggle__word');
    const dragHandle = card.querySelector('.drag-handle');
    const imageFileInput = card.querySelector('.f-image-file');
    const imageStatus = card.querySelector('.f-image-status');

    if (isNew) {
      dragHandle.classList.add('hidden');
    } else {
      wireDrag(card, dragHandle, index);
    }

    function openEdit() { card.classList.remove('is-confirming'); card.classList.add('is-editing'); editIconBtn.classList.add('is-active'); }
    function closeEdit() { card.classList.remove('is-editing'); editIconBtn.classList.remove('is-active'); }
    function openConfirm() { closeEdit(); card.classList.add('is-confirming'); }
    function closeConfirm() { card.classList.remove('is-confirming'); }

    editToggles.forEach((btn) => btn.addEventListener('click', () => (card.classList.contains('is-editing') ? closeEdit() : openEdit())));
    if (isNew) {
      // Never persisted yet — removing it is just a DOM removal, nothing to confirm or call the API for.
      deleteToggles.forEach((btn) => btn.addEventListener('click', () => card.remove()));
      cancelEditBtn.addEventListener('click', () => card.remove());
    } else {
      deleteToggles.forEach((btn) => btn.addEventListener('click', openConfirm));
      cancelEditBtn.addEventListener('click', closeEdit);
      cancelDeleteBtn.addEventListener('click', closeConfirm);
      confirmDeleteBtn.addEventListener('click', () => deleteBanner(b, confirmDeleteBtn));
    }

    linkTypeSeg.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        linkTypeSeg.querySelectorAll('button').forEach((b2) => b2.classList.remove('active'));
        btn.classList.add('active');
        card.querySelectorAll('.dest-field').forEach((f) => f.classList.add('hidden'));
        card.querySelector(`.dest-${btn.dataset.val}`).classList.remove('hidden');
      });
    });

    activeInput.addEventListener('change', () => {
      activeWord.textContent = activeInput.checked ? 'Показується' : 'Вимкнено';
      activeWord.className = 'status-toggle__word ' + (activeInput.checked ? 'active-text' : 'paused-text');
    });

    card.querySelector('.f-image').addEventListener('input', () => {
      card.querySelector('.image-picker__preview').src = card.querySelector('.f-image').value.trim();
      updatePreview(card);
    });
    card.querySelector('.f-title').addEventListener('input', () => updatePreview(card));
    card.querySelector('.f-subtitle').addEventListener('input', () => updatePreview(card));

    imageFileInput.addEventListener('change', async () => {
      const file = imageFileInput.files && imageFileInput.files[0];
      if (!file) return;
      AdminShared.setStatus(imageStatus, 'pending', 'Завантаження зображення...');
      try {
        const res = await fetch(`/api/banners?upload=1&filename=${encodeURIComponent(file.name)}`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
          body: file,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        card.querySelector('.f-image').value = body.url;
        card.querySelector('.image-picker__preview').src = body.url;
        updatePreview(card);
        imageStatus.className = 'status';
      } catch (err) {
        AdminShared.setStatus(imageStatus, 'err', 'Помилка: ' + err.message);
      } finally {
        imageFileInput.value = '';
      }
    });

    saveBtn.addEventListener('click', () => {
      const image = card.querySelector('.f-image').value.trim();
      if (!image) {
        AdminShared.setStatus(listStatus, 'err', 'Картинка банера обовʼязкова.');
        return;
      }
      const linkType = linkTypeSeg.querySelector('button.active').dataset.val;
      if (linkType === 'url' && !/^https?:\/\/.+/.test(card.querySelector('.f-url').value.trim())) {
        AdminShared.setStatus(listStatus, 'err', 'Введіть коректний URL (з http:// або https://).');
        return;
      }
      b.image = image;
      b.title = card.querySelector('.f-title').value;
      b.subtitle = card.querySelector('.f-subtitle').value;
      b.active = activeInput.checked;
      b.linkType = linkType;
      b.linkCategoryId = card.querySelector('.f-category').value;
      b.linkSaleId = card.querySelector('.f-sale').value;
      b.linkUrl = card.querySelector('.f-url').value;
      saveBanner(b, saveBtn);
    });

    return card;
  }

  async function saveBanner(b, triggerBtn) {
    if (triggerBtn) triggerBtn.disabled = true;
    const isNew = typeof b.id !== 'number';
    AdminShared.setStatus(listStatus, 'pending', isNew ? 'Додавання...' : 'Збереження...');
    try {
      const res = await fetch('/api/banners', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toApiPayload(b)),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      if (isNew) {
        b.id = body.id;
        banners.unshift(b);
        renderBanners();
        await persistOrder(); // pushes everyone else's sortOrder down so the new one sticks at the top
      }
      AdminShared.setStatus(listStatus, 'ok', isNew ? 'Додано.' : 'Збережено.');
      loadBanners();
    } catch (err) {
      AdminShared.setStatus(listStatus, 'err', 'Помилка: ' + err.message);
      if (triggerBtn) triggerBtn.disabled = false;
    }
  }

  async function deleteBanner(b, triggerBtn) {
    if (triggerBtn) triggerBtn.disabled = true;
    AdminShared.setStatus(listStatus, 'pending', 'Видалення...');
    try {
      const res = await fetch(`/api/banners?id=${encodeURIComponent(b.id)}`, {
        method: 'DELETE',
        credentials: 'include',
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(listStatus, 'ok', 'Видалено.');
      loadBanners();
    } catch (err) {
      AdminShared.setStatus(listStatus, 'err', 'Помилка: ' + err.message);
      if (triggerBtn) triggerBtn.disabled = false;
    }
  }

  document.getElementById('addBannerBtn').addEventListener('click', () => {
    const blank = {
      id: null, image: '', title: '', subtitle: '', active: true, sortOrder: 0,
      linkType: 'category', linkCategoryId: availableCategories[0] || '', linkSaleId: (activeSales[0] && activeSales[0].id) || '', linkUrl: '',
    };
    const card = buildBannerCard(blank, -1, true);
    card.classList.add('is-editing');
    card.querySelector('.save-edit-btn').textContent = 'Додати';
    bannerList.prepend(card);
  });

  AdminShared.init('banners').then((email) => {
    if (email) {
      // Run concurrently, not loadOptions().then(loadBanners) — loadOptions fetches the whole
      // product catalog just to derive category names, which can be slow, and there's no reason
      // the banner list itself should sit blocked behind that. Whichever finishes first renders
      // first; a final re-render after both settle fixes up any card whose category/sale
      // dropdown was built before loadOptions had populated the real option lists.
      Promise.all([loadOptions(), loadBanners()]).then(() => renderBanners());
    }
  });
</script>
</body>
</html>
