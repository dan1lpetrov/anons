<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Anons — Банери</title>
<script>(function(){try{var t=localStorage.getItem('anons-admin-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/admin.css" />
<style>
  .banner-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .banner-form-grid .full { grid-column: 1 / -1; }
  .banner-form-grid label { display: block; margin-bottom: 4px; }
  .banner-form-grid input[type="text"],
  .banner-form-grid input[type="number"],
  .banner-form-grid select { width: 100%; }
  .banner-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .banner-row:last-child { border-bottom: none; }
  .banner-row__thumb { width: 72px; height: 72px; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg); }
  .banner-row__body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .banner-row__title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner-row__meta { font-size: 12px; color: var(--hint); }
  .banner-row__actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; }
  .checkbox-field label { text-transform: none; font-size: 14px; font-weight: 400; color: var(--text); margin: 0; }
  .banner-image-picker { display: flex; align-items: flex-start; gap: 12px; }
  .banner-image-picker__preview { width: 96px; height: 96px; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg); border: 1px solid var(--border); flex-shrink: 0; }
  .banner-image-picker__controls { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .link-type-group { display: flex; gap: 16px; }
  .link-type-group label { display: flex; align-items: center; gap: 6px; text-transform: none; font-size: 14px; font-weight: 400; color: var(--text); margin: 0; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-screen__box">
    <h1>Anons Admin</h1>
    <p class="hint">Потрібен вхід через Google-акаунт адміністратора.</p>
    <a class="button primary" href="/admin">Перейти до входу</a>
  </div>
</div>

<div id="app" class="admin-shell hidden">
  <div id="nav"></div>
  <main class="admin-content">
    <div class="admin-content__inner">
      <div>
        <h1>Банери на головній</h1>
        <p class="hint">Керує каруселлю банерів на головному екрані сторефронту. Кожен банер обовʼязково веде кудись: на категорію, на активний розпродаж або на будь-яке зовнішнє посилання.</p>
      </div>

      <section id="addSection">
        <h2 id="formTitle">Додати банер</h2>
        <div class="banner-form-grid">
          <div class="full">
            <label for="imageFile">Картинка банера</label>
            <div class="banner-image-picker">
              <img id="imagePreview" class="banner-image-picker__preview hidden" alt="" />
              <div class="banner-image-picker__controls">
                <input id="imageFile" type="file" accept="image/*" />
                <input id="newImageUrl" type="text" placeholder="https://... (або завантаж файл вище)" />
              </div>
            </div>
            <div id="uploadStatus" class="status"></div>
          </div>
          <div>
            <label for="newTitle">Заголовок</label>
            <input id="newTitle" type="text" placeholder="SS24 COMING SOON" />
          </div>
          <div>
            <label for="newSubtitle">Підзаголовок</label>
            <input id="newSubtitle" type="text" placeholder="Дивитись" />
          </div>
          <div class="full">
            <label>Куди веде банер</label>
            <div class="link-type-group">
              <label><input type="radio" name="linkType" value="category" checked /> Категорія</label>
              <label><input type="radio" name="linkType" value="sale" /> Розпродаж</label>
              <label><input type="radio" name="linkType" value="url" /> URL</label>
            </div>
          </div>
          <div class="full" id="categoryField">
            <label for="newCategory">Категорія</label>
            <select id="newCategory"></select>
          </div>
          <div class="full hidden" id="saleField">
            <label for="newSale">Розпродаж</label>
            <select id="newSale"></select>
          </div>
          <div class="full hidden" id="urlField">
            <label for="newUrl">URL</label>
            <input id="newUrl" type="text" placeholder="https://..." />
          </div>
          <div>
            <label for="newOrder">Порядок</label>
            <input id="newOrder" type="number" step="1" value="0" />
          </div>
        </div>
        <div class="checkbox-field">
          <input id="newActive" type="checkbox" checked />
          <label for="newActive">Активний</label>
        </div>
        <div class="row">
          <button id="addBanner" class="primary" type="button">Додати банер</button>
          <button id="cancelEdit" class="secondary hidden" type="button">Скасувати</button>
        </div>
        <div id="addStatus" class="status"></div>
      </section>

      <section>
        <div class="row" style="justify-content: space-between;">
          <h2>Усі банери</h2>
          <button id="reloadBanners" class="secondary" type="button">Оновити</button>
        </div>
        <div id="bannersList"></div>
        <div id="listStatus" class="status"></div>
      </section>
    </div>
  </main>
</div>

<script src="/assets/admin.js"></script>
<script>
  const addImageUrl = document.getElementById('newImageUrl');
  const addTitle = document.getElementById('newTitle');
  const addSubtitle = document.getElementById('newSubtitle');
  const addCategory = document.getElementById('newCategory');
  const addOrder = document.getElementById('newOrder');
  const addActive = document.getElementById('newActive');
  const addStatus = document.getElementById('addStatus');
  const addBtn = document.getElementById('addBanner');
  const cancelEditBtn = document.getElementById('cancelEdit');
  const formTitle = document.getElementById('formTitle');

  const imageFile = document.getElementById('imageFile');
  const imagePreview = document.getElementById('imagePreview');
  const uploadStatus = document.getElementById('uploadStatus');
  const linkTypeRadios = document.querySelectorAll('input[name="linkType"]');
  const categoryField = document.getElementById('categoryField');
  const saleField = document.getElementById('saleField');
  const newSale = document.getElementById('newSale');
  const urlField = document.getElementById('urlField');
  const newUrl = document.getElementById('newUrl');

  const bannersList = document.getElementById('bannersList');
  const listStatus = document.getElementById('listStatus');
  const reloadBtn = document.getElementById('reloadBanners');

  // Mirrors the SaleId brand enum from src/types — see admin-upload.html's SALES map.
  const SALES = {
    nike: { name: 'Nike' },
    adidas: { name: 'Adidas' },
    puma: { name: 'Puma' },
  };
  let activeSales = [];

  // Mirrors src/data/categories.ts's CATEGORY_LABELS — categoryId isn't a
  // closed enum, so unknown ids just fall back to showing the raw id.
  const CATEGORY_LABELS = {
    shoes: 'Взуття',
    clothing: 'Одяг',
    accessories: 'Аксесуари',
    tshirts: 'Футболки',
    pants: 'Штани',
    jackets: 'Куртки',
  };
  let availableCategories = [];

  async function loadSalesOptions() {
    try {
      const res = await fetch('/api/sales', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const all = await res.json();
      activeSales = all.filter((s) => s.active);
    } catch (err) {
      activeSales = [];
    }
    newSale.innerHTML = '';
    if (activeSales.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'Немає активних розпродажів';
      newSale.appendChild(opt);
      return;
    }
    activeSales.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.saleId;
      opt.textContent = (SALES[s.saleId] && SALES[s.saleId].name) || s.saleId;
      newSale.appendChild(opt);
    });
  }

  async function loadCategoryOptions() {
    try {
      const res = await fetch('/api/products', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const products = await res.json();
      const seen = new Set();
      availableCategories = [];
      products.forEach((p) => {
        if (p.categoryId && !seen.has(p.categoryId)) {
          seen.add(p.categoryId);
          availableCategories.push(p.categoryId);
        }
      });
      availableCategories.sort((a, b) =>
        (CATEGORY_LABELS[a] || a).localeCompare(CATEGORY_LABELS[b] || b, 'uk'),
      );
    } catch (err) {
      availableCategories = [];
    }
    addCategory.innerHTML = '';
    if (availableCategories.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'Немає доступних категорій';
      addCategory.appendChild(opt);
      return;
    }
    availableCategories.forEach((id) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = CATEGORY_LABELS[id] || id;
      addCategory.appendChild(opt);
    });
  }

  function getLinkType() {
    return document.querySelector('input[name="linkType"]:checked').value;
  }

  function setLinkType(type) {
    document.querySelector(`input[name="linkType"][value="${type}"]`).checked = true;
    updateLinkFieldVisibility();
  }

  function updateLinkFieldVisibility() {
    const type = getLinkType();
    categoryField.classList.toggle('hidden', type !== 'category');
    saleField.classList.toggle('hidden', type !== 'sale');
    urlField.classList.toggle('hidden', type !== 'url');
  }

  linkTypeRadios.forEach((radio) => radio.addEventListener('change', updateLinkFieldVisibility));

  function updateImagePreview() {
    const url = addImageUrl.value.trim();
    if (url) {
      imagePreview.src = url;
      imagePreview.classList.remove('hidden');
    } else {
      imagePreview.classList.add('hidden');
    }
  }

  addImageUrl.addEventListener('input', updateImagePreview);

  imageFile.addEventListener('change', async () => {
    const file = imageFile.files && imageFile.files[0];
    if (!file) return;
    AdminShared.setStatus(uploadStatus, 'pending', 'Завантаження зображення...');
    try {
      const res = await fetch(`/api/banners?upload=1&filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': file.type || 'application/octet-stream' },
        body: file,
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      addImageUrl.value = body.url;
      updateImagePreview();
      AdminShared.setStatus(uploadStatus, 'ok', 'Зображення завантажено.');
    } catch (err) {
      AdminShared.setStatus(uploadStatus, 'err', 'Помилка: ' + err.message);
    } finally {
      imageFile.value = '';
    }
  });

  let editingId = null;

  function startEdit(banner) {
    editingId = banner.id;
    addImageUrl.value = banner.imageUrl || '';
    updateImagePreview();
    addTitle.value = banner.title || '';
    addSubtitle.value = banner.subtitle || '';
    addOrder.value = String(banner.sortOrder ?? 0);
    addActive.checked = !!banner.active;
    newUrl.value = '';
    if (banner.linkUrl) {
      setLinkType('url');
      newUrl.value = banner.linkUrl;
    } else if (banner.linkSaleId) {
      setLinkType('sale');
      newSale.value = banner.linkSaleId;
    } else if (banner.linkCategoryId) {
      setLinkType('category');
      addCategory.value = banner.linkCategoryId;
    } else {
      // Older banners saved before a link became mandatory — fall back to
      // "url" empty so the admin has to explicitly pick a destination now.
      setLinkType('url');
    }
    formTitle.textContent = 'Редагувати банер';
    addBtn.textContent = 'Зберегти зміни';
    cancelEditBtn.classList.remove('hidden');
    addStatus.className = 'status';
    addStatus.textContent = '';
    addImageUrl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function stopEdit() {
    editingId = null;
    addImageUrl.value = '';
    updateImagePreview();
    addTitle.value = '';
    addSubtitle.value = '';
    newUrl.value = '';
    setLinkType('category');
    addOrder.value = '0';
    addActive.checked = true;
    formTitle.textContent = 'Додати банер';
    addBtn.textContent = 'Додати банер';
    cancelEditBtn.classList.add('hidden');
  }

  async function loadBanners() {
    AdminShared.setStatus(listStatus, 'pending', 'Завантаження...');
    try {
      const res = await fetch('/api/banners?all=1', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      const banners = await res.json();
      renderBanners(banners);
      listStatus.className = 'status';
    } catch (err) {
      AdminShared.setStatus(listStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  function renderBanners(banners) {
    bannersList.innerHTML = '';
    if (banners.length === 0) {
      bannersList.innerHTML = `<div class="empty-state">${AdminShared.icon('inbox', 32)}<p>Ще немає жодного банера.</p></div>`;
      return;
    }

    banners.forEach((banner) => {
      const row = document.createElement('div');
      row.className = 'banner-row';

      const thumb = document.createElement('img');
      thumb.className = 'banner-row__thumb';
      thumb.src = banner.imageUrl;
      thumb.alt = '';

      const body = document.createElement('div');
      body.className = 'banner-row__body';
      const title = document.createElement('div');
      title.className = 'banner-row__title';
      title.textContent = banner.title || '(без заголовка)';
      const meta = document.createElement('div');
      meta.className = 'banner-row__meta';
      const saleLabel = banner.linkSaleId ? (SALES[banner.linkSaleId] && SALES[banner.linkSaleId].name) || banner.linkSaleId : '';
      const categoryLabel = banner.linkCategoryId ? CATEGORY_LABELS[banner.linkCategoryId] || banner.linkCategoryId : '';
      meta.textContent = `#${banner.sortOrder} · ${banner.active ? 'Активний' : 'Вимкнений'}${categoryLabel ? ' · категорія → ' + categoryLabel : ''}${saleLabel ? ' · розпродаж → ' + saleLabel : ''}${banner.linkUrl ? ' · URL → ' + banner.linkUrl : ''}`;
      body.append(title, meta);

      const actions = document.createElement('div');
      actions.className = 'banner-row__actions';

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'secondary';
      editBtn.textContent = 'Редагувати';
      editBtn.addEventListener('click', () => startEdit(banner));

      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'secondary';
      toggleBtn.textContent = banner.active ? 'Вимкнути' : 'Увімкнути';
      toggleBtn.addEventListener('click', () => saveBanner({ ...banner, active: !banner.active }));

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'danger';
      deleteBtn.textContent = 'Видалити';
      deleteBtn.addEventListener('click', () => deleteBanner(banner.id));

      actions.append(editBtn, toggleBtn, deleteBtn);
      row.append(thumb, body, actions);
      bannersList.appendChild(row);
    });
  }

  async function saveBanner(banner) {
    AdminShared.setStatus(listStatus, 'pending', 'Збереження...');
    try {
      const res = await fetch('/api/banners', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(banner),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(listStatus, 'ok', 'Збережено.');
      loadBanners();
    } catch (err) {
      AdminShared.setStatus(listStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  async function deleteBanner(id) {
    if (!confirm('Видалити цей банер?')) return;
    AdminShared.setStatus(listStatus, 'pending', 'Видалення...');
    try {
      const res = await fetch(`/api/banners?id=${encodeURIComponent(id)}`, {
        method: 'DELETE',
        credentials: 'include',
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(listStatus, 'ok', 'Видалено.');
      loadBanners();
    } catch (err) {
      AdminShared.setStatus(listStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  addBtn.addEventListener('click', async () => {
    if (!addImageUrl.value.trim()) {
      AdminShared.setStatus(addStatus, 'err', 'URL картинки обовʼязковий.');
      return;
    }
    const isEdit = editingId !== null;
    const linkType = getLinkType();
    if (linkType === 'category' && !addCategory.value) {
      AdminShared.setStatus(addStatus, 'err', 'Оберіть категорію.');
      return;
    }
    if (linkType === 'sale' && !newSale.value) {
      AdminShared.setStatus(addStatus, 'err', 'Оберіть активний розпродаж.');
      return;
    }
    if (linkType === 'url' && !/^https?:\/\/.+/.test(newUrl.value.trim())) {
      AdminShared.setStatus(addStatus, 'err', 'Введіть коректний URL (з http:// або https://).');
      return;
    }
    addBtn.disabled = true;
    try {
      AdminShared.setStatus(addStatus, 'pending', isEdit ? 'Збереження...' : 'Додавання...');
      await saveBanner({
        ...(isEdit ? { id: editingId } : {}),
        imageUrl: addImageUrl.value.trim(),
        title: addTitle.value.trim(),
        subtitle: addSubtitle.value.trim(),
        linkCategoryId: linkType === 'category' ? addCategory.value || null : null,
        linkSaleId: linkType === 'sale' ? newSale.value : null,
        linkUrl: linkType === 'url' ? newUrl.value.trim() : null,
        sortOrder: Number(addOrder.value) || 0,
        active: addActive.checked,
      });
      stopEdit();
      AdminShared.setStatus(addStatus, 'ok', isEdit ? 'Збережено.' : 'Додано.');
    } catch (err) {
      AdminShared.setStatus(addStatus, 'err', 'Помилка: ' + err.message);
    } finally {
      addBtn.disabled = false;
    }
  });

  cancelEditBtn.addEventListener('click', () => {
    stopEdit();
    addStatus.className = 'status';
    addStatus.textContent = '';
  });

  reloadBtn.addEventListener('click', loadBanners);

  AdminShared.init('banners').then((email) => {
    if (email) {
      // Loaded together so the category/sale <select>s already have their
      // options by the time a banner row's "Редагувати" button is clickable.
      Promise.all([loadBanners(), loadSalesOptions(), loadCategoryOptions()]);
    }
  });
</script>
</body>
</html>
