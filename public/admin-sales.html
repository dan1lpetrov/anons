<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Anons — Розпродажі</title>
<script>(function(){try{var t=localStorage.getItem('anons-admin-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/admin.css" />
</head>
<body>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-screen__box">
    <h1>Anons Admin</h1>
    <p class="hint" id="loginStatus"></p>
    <a class="button primary" href="/api/auth/login">Увійти через Google</a>
  </div>
</div>

<div id="app" class="admin-shell hidden">
  <div id="nav"></div>
  <main class="admin-content">
    <div class="admin-content__inner">
      <div class="row" style="justify-content: space-between;">
        <h1>Розпродажі</h1>
        <a class="button primary" href="/admin/upload">+ Додати розпродаж</a>
      </div>

      <section>
        <h2>Валюта показу на сайті</h2>
        <p class="hint">Спільна для всього сайту, не залежить від розпродажу. Комісія/знижка лишаються окремо для кожного розпродажу нижче.</p>
        <div id="currencyEditor"></div>
        <div class="row" style="margin-top: 12px;">
          <button id="saveCurrency" class="primary" type="button">Зберегти валюту (перерахує ціни всіх товарів)</button>
        </div>
        <div id="currencyStatus" class="status"></div>
      </section>

      <section>
        <div class="row" style="justify-content: space-between;">
          <span class="hint">Термін дії, активність, комісія/знижка і видалення розпродажів</span>
          <button id="reloadSales" class="secondary" type="button">Оновити</button>
        </div>
        <div id="salesList"></div>
        <div id="salesStatus" class="status"></div>
      </section>
    </div>
  </main>
</div>

<script src="/assets/admin.js"></script>
<script>
  const loginStatus = document.getElementById('loginStatus');
  const salesList = document.getElementById('salesList');
  const salesStatus = document.getElementById('salesStatus');
  const reloadSalesBtn = document.getElementById('reloadSales');
  const currencyEditorEl = document.getElementById('currencyEditor');
  const currencyStatus = document.getElementById('currencyStatus');
  const saveCurrencyBtn = document.getElementById('saveCurrency');

  const ERROR_MESSAGES = {
    forbidden: 'Цей Google-акаунт не має доступу до адмінки.',
    invalid_state: 'Сесія входу застаріла, спробуй ще раз.',
    email_not_verified: 'Пошта Google-акаунта не підтверджена.',
    token_exchange_failed: 'Не вдалося завершити вхід через Google.',
  };

  const MANUAL_RATE_BANKS = new Set(['pumb', 'sens']);
  const AUTO_RATE_BANKS = new Set(['mono', 'privat']);

  (function showLoginError() {
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    if (error) {
      loginStatus.textContent = ERROR_MESSAGES[error] || ('Помилка входу: ' + error);
      history.replaceState(null, '', location.pathname);
    }
  })();

  async function loadSales() {
    AdminShared.setStatus(salesStatus, 'pending', 'Завантаження...');
    try {
      const res = await fetch('/api/sales', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      const sales = await res.json();
      renderSales(sales);
      salesStatus.className = 'status';
    } catch (err) {
      AdminShared.setStatus(salesStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  function renderSales(sales) {
    salesList.innerHTML = '';
    if (sales.length === 0) {
      salesList.innerHTML = `<div class="empty-state">${AdminShared.icon('inbox', 32)}<p>Ще немає жодного залитого товару. Натисни "Додати розпродаж".</p></div>`;
      return;
    }

    sales.forEach((sale) => {
      const row = document.createElement('div');
      row.className = 'sale-row';

      const brand = document.createElement('span');
      brand.className = 'sale-row__name';
      brand.textContent = sale.saleId;

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = sale.name;
      nameInput.style.width = '160px';

      const badge = document.createElement('span');
      badge.className = 'sale-row__badge ' + (sale.active ? 'active' : 'stopped');
      badge.textContent = sale.active ? 'Активна' : 'Зупинена';

      const countLabel = document.createElement('span');
      countLabel.className = 'hint';
      countLabel.textContent = `товарів: ${sale.productCount}`;

      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.value = sale.endDate ? sale.endDate.slice(0, 10) : '';

      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'secondary';
      saveBtn.textContent = 'Зберегти';
      saveBtn.addEventListener('click', () =>
        saveSale(sale.id, { name: nameInput.value, endDate: dateInput.value || null, active: sale.active }),
      );

      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = sale.active ? 'danger' : 'secondary';
      toggleBtn.textContent = sale.active ? 'Зупинити' : 'Відновити';
      toggleBtn.addEventListener('click', () =>
        saveSale(sale.id, { name: nameInput.value, endDate: dateInput.value || null, active: !sale.active }),
      );

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'danger';
      deleteBtn.textContent = 'Видалити';
      deleteBtn.addEventListener('click', () => deleteSale(sale.id, sale.name));

      const conditionsLabel = document.createElement('span');
      conditionsLabel.className = 'hint';
      conditionsLabel.style.flexBasis = '100%';
      conditionsLabel.textContent = formatConditions(sale);

      const conditionsBtn = document.createElement('button');
      conditionsBtn.type = 'button';
      conditionsBtn.className = 'secondary';
      conditionsBtn.textContent = 'Умови';

      const conditionsPanel = buildConditionsPanel(sale, () =>
        saveSale(sale.id, { name: nameInput.value, endDate: dateInput.value || null, active: sale.active }, readPanelConditions(conditionsPanel)),
      );
      conditionsPanel.classList.add('hidden');
      conditionsBtn.addEventListener('click', () => conditionsPanel.classList.toggle('hidden'));

      row.append(brand, nameInput, badge, countLabel, dateInput, saveBtn, toggleBtn, conditionsBtn, deleteBtn, conditionsLabel, conditionsPanel);
      salesList.appendChild(row);
    });
  }

  function formatConditions(sale) {
    return `комісія ${sale.buyerCommissionPercent}% · знижка ${sale.additionalDiscountPercent}%`;
  }

  // Every campaign has its own editable commission/discount — building this per sale-row rather
  // than sharing one global form keeps that explicit. Currency lives in the global panel above
  // instead (see buildCurrencyEditor), since it's the same for every campaign on the site.
  function buildConditionsPanel(sale, onSave) {
    const panel = document.createElement('div');
    panel.className = 'conditions-grid';
    panel.style.flexBasis = '100%';

    const commissionInput = document.createElement('input');
    commissionInput.type = 'number';
    commissionInput.step = '0.1';
    commissionInput.min = '0';
    commissionInput.value = sale.buyerCommissionPercent;

    const discountInput = document.createElement('input');
    discountInput.type = 'number';
    discountInput.step = '0.1';
    discountInput.min = '0';
    discountInput.value = sale.additionalDiscountPercent;

    function labeled(text) {
      const label = document.createElement('label');
      label.textContent = text;
      return label;
    }

    const saveConditionsBtn = document.createElement('button');
    saveConditionsBtn.type = 'button';
    saveConditionsBtn.className = 'primary';
    saveConditionsBtn.textContent = 'Зберегти умови (перерахує ціни товарів)';
    saveConditionsBtn.addEventListener('click', onSave);

    panel._inputs = { commissionInput, discountInput };

    panel.append(
      labeled('Комісія баєра, %'),
      commissionInput,
      labeled('Додаткова знижка, %'),
      discountInput,
      document.createElement('div'),
      saveConditionsBtn,
    );
    return panel;
  }

  function readPanelConditions(panel) {
    const { commissionInput, discountInput } = panel._inputs;
    return {
      buyerCommissionPercent: Number(commissionInput.value),
      additionalDiscountPercent: Number(discountInput.value),
    };
  }

  // --- Site-wide display currency (see api/_lib/siteSettings.ts) ---
  let currencyInputs = null;

  function buildCurrencyEditor() {
    const currencySelect = document.createElement('select');
    currencySelect.innerHTML = `
      <option value="original">Оригінальна (USD)</option>
      <option value="uah">Гривня (за курсом банку)</option>
    `;

    const bankSelect = document.createElement('select');
    bankSelect.innerHTML = `
      <option value="mono">Monobank (курс — автоматично)</option>
      <option value="privat">ПриватБанк (курс — автоматично)</option>
      <option value="pumb">ПУМБ (курс — вручну)</option>
      <option value="sens">Sense Bank (курс — вручну)</option>
    `;

    const rateInput = document.createElement('input');
    rateInput.type = 'number';
    rateInput.step = '0.0001';
    rateInput.min = '0';
    rateInput.placeholder = 'напр. 41.5';

    const refreshRateBtn = document.createElement('button');
    refreshRateBtn.type = 'button';
    refreshRateBtn.className = 'secondary';
    refreshRateBtn.textContent = 'Оновити курс';
    refreshRateBtn.addEventListener('click', async () => {
      refreshRateBtn.disabled = true;
      try {
        const res = await fetch(`/api/sales?fetchRate=${encodeURIComponent(bankSelect.value)}`, {
          cache: 'no-store',
          credentials: 'include',
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        rateInput.value = body.rate;
      } catch (err) {
        AdminShared.setStatus(currencyStatus, 'err', 'Помилка: ' + err.message);
      } finally {
        refreshRateBtn.disabled = false;
      }
    });

    const rateRow = document.createElement('div');
    rateRow.className = 'row';
    rateRow.append(rateInput, refreshRateBtn);

    function labeled(text) {
      const label = document.createElement('label');
      label.textContent = text;
      return label;
    }
    const bankLabel = labeled('Банк');
    const rateLabel = labeled('Курс, ₴ за $1');

    function updateVisibility() {
      const isUah = currencySelect.value === 'uah';
      bankLabel.classList.toggle('hidden', !isUah);
      bankSelect.classList.toggle('hidden', !isUah);
      rateLabel.classList.toggle('hidden', !isUah);
      rateRow.classList.toggle('hidden', !isUah);
      refreshRateBtn.classList.toggle('hidden', !AUTO_RATE_BANKS.has(bankSelect.value));
    }
    currencySelect.addEventListener('change', updateVisibility);
    bankSelect.addEventListener('change', updateVisibility);

    const panel = document.createElement('div');
    panel.className = 'conditions-grid';
    panel.append(labeled('Валюта показу'), currencySelect, bankLabel, bankSelect, rateLabel, rateRow);
    currencyEditorEl.innerHTML = '';
    currencyEditorEl.appendChild(panel);

    currencyInputs = { currencySelect, bankSelect, rateInput };
    updateVisibility();
  }

  async function loadCurrency() {
    AdminShared.setStatus(currencyStatus, 'pending', 'Завантаження...');
    try {
      const res = await fetch('/api/sales?global=1', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      const currency = await res.json();
      if (!currencyInputs) buildCurrencyEditor();
      currencyInputs.currencySelect.value = currency.displayCurrency;
      currencyInputs.bankSelect.value = currency.uahBank || 'mono';
      if (currency.uahRate) currencyInputs.rateInput.value = currency.uahRate;
      currencyInputs.currencySelect.dispatchEvent(new Event('change'));
      currencyStatus.className = 'status';
    } catch (err) {
      AdminShared.setStatus(currencyStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  saveCurrencyBtn.addEventListener('click', async () => {
    if (!currencyInputs) return;
    const { currencySelect, bankSelect, rateInput } = currencyInputs;
    const payload = { global: true, displayCurrency: currencySelect.value };
    if (currencySelect.value === 'uah') {
      payload.uahBank = bankSelect.value;
      if (MANUAL_RATE_BANKS.has(bankSelect.value) || rateInput.value) {
        payload.uahRate = Number(rateInput.value);
      }
    }
    saveCurrencyBtn.disabled = true;
    AdminShared.setStatus(currencyStatus, 'pending', 'Зберігаю валюту й перераховую ціни всіх товарів...');
    try {
      const res = await fetch('/api/sales', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(currencyStatus, 'ok', `Збережено. Перераховано цін: ${body.repricedCount ?? 0}.`);
      if (body.uahRate) rateInput.value = body.uahRate;
    } catch (err) {
      AdminShared.setStatus(currencyStatus, 'err', 'Помилка: ' + err.message);
    } finally {
      saveCurrencyBtn.disabled = false;
    }
  });

  async function saveSale(id, { name, endDate, active }, conditions) {
    AdminShared.setStatus(salesStatus, 'pending', conditions ? 'Зберігаю умови й перераховую ціни...' : 'Збереження...');
    try {
      const res = await fetch('/api/sales', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, endDate, active, ...conditions }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(
        salesStatus,
        'ok',
        conditions ? `Збережено. Перераховано цін: ${body.repricedCount ?? 0}.` : 'Збережено.',
      );
      loadSales();
    } catch (err) {
      AdminShared.setStatus(salesStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  async function deleteSale(id, name) {
    if (!confirm(`Видалити кампанію "${name}" і всі її товари? Це незворотньо.`)) return;
    AdminShared.setStatus(salesStatus, 'pending', 'Видалення...');
    try {
      const res = await fetch(`/api/sales?id=${encodeURIComponent(id)}`, {
        method: 'DELETE',
        credentials: 'include',
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(salesStatus, 'ok', `Видалено. Товарів прибрано: ${body.removedProducts ?? 0}.`);
      loadSales();
    } catch (err) {
      AdminShared.setStatus(salesStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  reloadSalesBtn.addEventListener('click', loadSales);

  AdminShared.init('sales').then((email) => {
    if (email) {
      loadCurrency();
      loadSales();
    }
  });
</script>
</body>
</html>
