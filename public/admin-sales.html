<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Anons — Розпродажі</title>
<script>(function(){try{var t=localStorage.getItem('anons-admin-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/admin.css" />
</head>
<body>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-screen__box">
    <h1>Anons Admin</h1>
    <p class="hint" id="loginStatus"></p>
    <a class="button primary" href="/api/auth/login">Увійти через Google</a>
  </div>
</div>

<div id="app" class="admin-shell hidden">
  <div id="nav"></div>
  <main class="admin-content">
    <div class="admin-content__inner">
      <div class="row" style="justify-content: space-between;">
        <h1>Розпродажі</h1>
        <a class="button primary" href="/admin/upload">+ Додати розпродаж</a>
      </div>

      <section class="currency-section">
        <h2>Валюта показу на сайті</h2>
        <p class="hint">Спільна для всього сайту, не залежить від розпродажу. Комісія й знижка лишаються окремо для кожної кампанії нижче.</p>
        <div class="field-grid">
          <div class="field">
            <label>Валюта показу</label>
            <select id="currencySelect">
              <option value="original">Оригінальна (USD)</option>
              <option value="uah">Гривня (за курсом банку)</option>
            </select>
          </div>
          <div class="field" id="bankField">
            <label>Банк</label>
            <select id="bankSelect">
              <option value="mono">Monobank</option>
              <option value="privat">ПриватБанк</option>
              <option value="">Власний курс</option>
            </select>
          </div>
          <div class="field field-span-2" id="rateField">
            <label>Курс, ₴ за $1</label>
            <div class="rate-row">
              <input type="number" step="0.0001" min="0" id="rateInput" placeholder="напр. 41.5" />
              <button id="refreshRateBtn" class="secondary" type="button">Оновити курс</button>
            </div>
          </div>
        </div>
        <div class="currency-footer">
          <span id="currencyStatus" class="status"></span>
          <button id="saveCurrency" class="primary" type="button">Зберегти валюту (перерахує ціни всіх товарів)</button>
        </div>
      </section>

      <section class="section-plain">
        <div class="row" style="justify-content: space-between;">
          <h2 class="card__title">Кампанії</h2>
          <button id="reloadSales" class="secondary" type="button">Оновити</button>
        </div>
        <div id="salesSummary" class="sales-summary"></div>
        <div id="salesList" class="sale-list"></div>
        <div id="salesStatus" class="status"></div>
      </section>
    </div>
  </main>
</div>

<script src="/assets/admin.js"></script>
<script>
  const loginStatus = document.getElementById('loginStatus');
  const salesList = document.getElementById('salesList');
  const salesSummary = document.getElementById('salesSummary');
  const salesStatus = document.getElementById('salesStatus');
  const reloadSalesBtn = document.getElementById('reloadSales');

  const ERROR_MESSAGES = {
    forbidden: 'Цей Google-акаунт не має доступу до адмінки.',
    invalid_state: 'Сесія входу застаріла, спробуй ще раз.',
    email_not_verified: 'Пошта Google-акаунта не підтверджена.',
    token_exchange_failed: 'Не вдалося завершити вхід через Google.',
  };

  const NAMED_BANKS = new Set(['mono', 'privat']);

  (function showLoginError() {
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    if (error) {
      loginStatus.textContent = ERROR_MESSAGES[error] || ('Помилка входу: ' + error);
      history.replaceState(null, '', location.pathname);
    }
  })();

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.slice(0, 10).split('-');
    return `${d}.${m}.${y}`;
  }

  function termsChip(commission, discount) {
    return `<span class="terms-chip"><span class="commission">+${commission}%</span><span class="divider">·</span><span class="discount">−${discount}%</span></span>`;
  }

  // --- Sales list ---
  let currentSales = [];

  async function loadSales() {
    AdminShared.setStatus(salesStatus, 'pending', 'Завантаження...');
    try {
      const res = await fetch('/api/sales', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      currentSales = await res.json();
      renderSales(currentSales);
      salesStatus.className = 'status';
    } catch (err) {
      AdminShared.setStatus(salesStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  function renderSummary(sales) {
    if (sales.length === 0) {
      salesSummary.innerHTML = '';
      return;
    }
    const activeCount = sales.filter((s) => s.active).length;
    const stoppedCount = sales.length - activeCount;
    const totalProducts = sales.reduce((sum, s) => sum + (s.productCount || 0), 0);
    salesSummary.innerHTML = `
      <span><span class="dot-inline" style="background:var(--success)"></span><b>${activeCount}</b> активні</span>
      <span><span class="dot-inline" style="background:var(--danger)"></span><b>${stoppedCount}</b> на паузі</span>
      <span><b>${totalProducts}</b> товарів усього</span>
    `;
  }

  function renderSales(sales) {
    salesList.innerHTML = '';
    renderSummary(sales);
    if (sales.length === 0) {
      salesList.innerHTML = `<div class="empty-state">${AdminShared.icon('inbox', 32)}<p>Ще немає жодного залитого товару. Натисни "Додати розпродаж".</p></div>`;
      return;
    }
    sales.forEach((sale) => salesList.appendChild(buildSaleCard(sale)));
  }

  function buildSaleCard(sale) {
    const initialCommission = sale.buyerCommissionPercent;
    const initialDiscount = sale.additionalDiscountPercent;

    const card = document.createElement('section');
    card.className = 'sale-card';
    card.innerHTML = `
      <div class="sale-card__row">
        <span class="status-dot ${sale.active ? 'active' : 'stopped'}"></span>
        <div class="sale-card__identity">
          <span class="sale-card__name">${escapeHtml(sale.name)}</span>
          <span class="sale-card__brand">${escapeHtml(sale.saleId)}</span>
        </div>
        <div class="sale-card__meta">
          <div class="meta-item"><span>Закінчення</span><b>${fmtDate(sale.endDate)}</b></div>
          <div class="meta-item"><span>Товарів</span><b>${sale.productCount}</b></div>
          ${termsChip(sale.buyerCommissionPercent, sale.additionalDiscountPercent)}
        </div>
        <div class="sale-card__actions">
          <button type="button" class="icon-btn edit-toggle" title="Редагувати">${AdminShared.icon('pencil', 14)}</button>
          <button type="button" class="icon-btn danger delete-toggle" title="Видалити">${AdminShared.icon('trash', 14)}</button>
        </div>
      </div>
      <div class="sale-card__panel sale-card__edit">
        <div class="field-grid sale-form-grid">
          <div class="field field-span-2">
            <label>Назва кампанії</label>
            <input type="text" class="f-name" value="${escapeHtml(sale.name)}" />
          </div>
          <div class="field">
            <label>Дата закінчення</label>
            <input type="date" class="f-date" value="${sale.endDate ? sale.endDate.slice(0, 10) : ''}" />
          </div>
          <div class="field">
            <label>Статус</label>
            <div class="status-toggle">
              <label class="switch">
                <input type="checkbox" class="f-active" ${sale.active ? 'checked' : ''} />
                <span class="switch-track"></span>
              </label>
              <span class="status-toggle__word ${sale.active ? 'active-text' : 'paused-text'}">${sale.active ? 'Активна' : 'На паузі'}</span>
            </div>
          </div>
          <div class="field">
            <label>Комісія баєра, %</label>
            <input type="number" step="0.1" min="0" class="f-commission" value="${sale.buyerCommissionPercent}" />
          </div>
          <div class="field">
            <label>Додаткова знижка, %</label>
            <input type="number" step="0.1" min="0" class="f-discount" value="${sale.additionalDiscountPercent}" />
          </div>
        </div>
        <div class="sale-form-footer">
          <button type="button" class="danger delete-toggle">Видалити розпродаж</button>
          <div class="row">
            <button type="button" class="secondary cancel-edit-btn">Скасувати</button>
            <button type="button" class="primary save-edit-btn">Зберегти</button>
          </div>
        </div>
      </div>
      <div class="sale-card__panel sale-card__confirm">
        <span class="sale-card__confirm-text">Видалити <b>«${escapeHtml(sale.name)}»</b> і всі ${sale.productCount} товарів? Це незворотньо.</span>
        <div class="sale-card__confirm-actions">
          <button type="button" class="secondary cancel-delete-btn">Скасувати</button>
          <button type="button" class="danger confirm-delete-btn">Так, видалити</button>
        </div>
      </div>
    `;

    const editToggleBtns = card.querySelectorAll('.edit-toggle');
    const deleteToggleBtns = card.querySelectorAll('.delete-toggle');
    const cancelEditBtn = card.querySelector('.cancel-edit-btn');
    const saveEditBtn = card.querySelector('.save-edit-btn');
    const cancelDeleteBtn = card.querySelector('.cancel-delete-btn');
    const confirmDeleteBtn = card.querySelector('.confirm-delete-btn');
    const activeInput = card.querySelector('.f-active');
    const statusWord = card.querySelector('.status-toggle__word');
    const editIconBtn = card.querySelector('.sale-card__actions .edit-toggle');

    function openEdit() {
      card.classList.remove('is-confirming');
      card.classList.add('is-editing');
      editIconBtn.classList.add('is-active');
    }
    function closeEdit() {
      card.classList.remove('is-editing');
      editIconBtn.classList.remove('is-active');
    }
    function openConfirm() {
      closeEdit();
      card.classList.add('is-confirming');
    }
    function closeConfirm() {
      card.classList.remove('is-confirming');
    }

    editToggleBtns.forEach((btn) =>
      btn.addEventListener('click', () => {
        if (card.classList.contains('is-editing')) closeEdit();
        else openEdit();
      }),
    );
    deleteToggleBtns.forEach((btn) => btn.addEventListener('click', openConfirm));
    cancelEditBtn.addEventListener('click', closeEdit);
    cancelDeleteBtn.addEventListener('click', closeConfirm);

    activeInput.addEventListener('change', () => {
      statusWord.textContent = activeInput.checked ? 'Активна' : 'На паузі';
      statusWord.className = 'status-toggle__word ' + (activeInput.checked ? 'active-text' : 'paused-text');
    });

    saveEditBtn.addEventListener('click', () => {
      const name = card.querySelector('.f-name').value.trim();
      const endDate = card.querySelector('.f-date').value || null;
      const active = activeInput.checked;
      const commission = Number(card.querySelector('.f-commission').value);
      const discount = Number(card.querySelector('.f-discount').value);
      // Only send condition fields when they actually changed — the backend only reprices
      // the campaign's products when conditions are present in the body (see CLAUDE.md),
      // so a pure rename/date/pause save stays cheap instead of always sweeping prices.
      const conditionsChanged = commission !== initialCommission || discount !== initialDiscount;
      const conditions = conditionsChanged
        ? { buyerCommissionPercent: commission, additionalDiscountPercent: discount }
        : undefined;
      saveSale(sale.id, { name, endDate, active }, conditions, saveEditBtn);
    });

    confirmDeleteBtn.addEventListener('click', () => deleteSale(sale.id, sale.name, confirmDeleteBtn));

    return card;
  }

  async function saveSale(id, { name, endDate, active }, conditions, triggerBtn) {
    if (triggerBtn) triggerBtn.disabled = true;
    AdminShared.setStatus(salesStatus, 'pending', conditions ? 'Зберігаю умови й перераховую ціни...' : 'Збереження...');
    try {
      const res = await fetch('/api/sales', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, endDate, active, ...conditions }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(
        salesStatus,
        'ok',
        conditions ? `Збережено. Перераховано цін: ${body.repricedCount ?? 0}.` : 'Збережено.',
      );
      loadSales();
    } catch (err) {
      AdminShared.setStatus(salesStatus, 'err', 'Помилка: ' + err.message);
      if (triggerBtn) triggerBtn.disabled = false;
    }
  }

  async function deleteSale(id, name, triggerBtn) {
    if (triggerBtn) triggerBtn.disabled = true;
    AdminShared.setStatus(salesStatus, 'pending', 'Видалення...');
    try {
      const res = await fetch(`/api/sales?id=${encodeURIComponent(id)}`, {
        method: 'DELETE',
        credentials: 'include',
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(salesStatus, 'ok', `Видалено "${name}". Товарів прибрано: ${body.removedProducts ?? 0}.`);
      loadSales();
    } catch (err) {
      AdminShared.setStatus(salesStatus, 'err', 'Помилка: ' + err.message);
      if (triggerBtn) triggerBtn.disabled = false;
    }
  }

  reloadSalesBtn.addEventListener('click', loadSales);

  // --- Site-wide display currency (see api/_lib/siteSettings.ts) ---
  const currencySelect = document.getElementById('currencySelect');
  const bankSelect = document.getElementById('bankSelect');
  const bankField = document.getElementById('bankField');
  const rateField = document.getElementById('rateField');
  const rateInput = document.getElementById('rateInput');
  const refreshRateBtn = document.getElementById('refreshRateBtn');
  const saveCurrencyBtn = document.getElementById('saveCurrency');
  const currencyStatus = document.getElementById('currencyStatus');

  function updateCurrencyVisibility() {
    const isUah = currencySelect.value === 'uah';
    bankField.classList.toggle('hidden', !isUah);
    rateField.classList.toggle('hidden', !isUah);
    const isNamedBank = NAMED_BANKS.has(bankSelect.value);
    refreshRateBtn.classList.toggle('hidden', !isNamedBank);
    // Named banks always fetch fresh at save time — this field can only preview, not commit,
    // a value for them. Custom is the opposite: always the admin's own typed number.
    rateInput.disabled = isNamedBank;
    rateInput.placeholder = isNamedBank ? 'отримується автоматично при збереженні' : 'напр. 41.5';
  }
  currencySelect.addEventListener('change', updateCurrencyVisibility);
  bankSelect.addEventListener('change', updateCurrencyVisibility);
  updateCurrencyVisibility();

  // Preview-only for mono/privat — saving always re-fetches a fresh rate at that moment
  // regardless of what's shown here (see api/sales.ts's resolveSiteCurrency), so this button
  // just lets the admin see roughly what they're about to commit the whole site's prices to.
  refreshRateBtn.addEventListener('click', async () => {
    refreshRateBtn.disabled = true;
    try {
      const res = await fetch(`/api/sales?fetchRate=${encodeURIComponent(bankSelect.value)}`, {
        cache: 'no-store',
        credentials: 'include',
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      rateInput.value = body.rate;
    } catch (err) {
      AdminShared.setStatus(currencyStatus, 'err', 'Помилка: ' + err.message);
    } finally {
      refreshRateBtn.disabled = false;
    }
  });

  async function loadCurrency() {
    AdminShared.setStatus(currencyStatus, 'pending', 'Завантаження...');
    try {
      const res = await fetch('/api/sales?global=1', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      const currency = await res.json();
      currencySelect.value = currency.displayCurrency;
      bankSelect.value = currency.uahBank || '';
      if (currency.uahRate) rateInput.value = currency.uahRate;
      updateCurrencyVisibility();
      currencyStatus.className = 'status';
    } catch (err) {
      AdminShared.setStatus(currencyStatus, 'err', 'Помилка: ' + err.message);
    }
  }

  saveCurrencyBtn.addEventListener('click', async () => {
    const payload = { global: true, displayCurrency: currencySelect.value };
    if (currencySelect.value === 'uah') {
      if (NAMED_BANKS.has(bankSelect.value)) {
        payload.uahBank = bankSelect.value;
      } else {
        payload.uahBank = null;
        payload.uahRate = Number(rateInput.value);
      }
    }
    saveCurrencyBtn.disabled = true;
    AdminShared.setStatus(currencyStatus, 'pending', 'Зберігаю валюту й перераховую ціни всіх товарів...');
    try {
      const res = await fetch('/api/sales', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      AdminShared.setStatus(currencyStatus, 'ok', `Збережено. Перераховано цін: ${body.repricedCount ?? 0}.`);
      if (body.uahRate) rateInput.value = body.uahRate;
    } catch (err) {
      AdminShared.setStatus(currencyStatus, 'err', 'Помилка: ' + err.message);
    } finally {
      saveCurrencyBtn.disabled = false;
    }
  });

  AdminShared.init('sales').then((email) => {
    if (email) {
      loadCurrency();
      loadSales();
    }
  });
</script>
</body>
</html>
