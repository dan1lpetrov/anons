<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Anons — Адмінка товарів</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --hint: #8e8e93;
    --accent: #2481cc;
    --danger: #ff3b30;
    --success: #34c759;
    --secondary-bg: #f2f2f7;
    --radius: 12px;
    --border: #e5e5ea;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--secondary-bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { font-size: 20px; }
  p.hint { color: var(--hint); font-size: 14px; }
  section {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--border);
  }
  textarea {
    font: inherit;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--secondary-bg);
    color: var(--text);
    width: 100%;
    min-height: 220px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    resize: vertical;
  }
  label { font-size: 13px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: 0.02em; }
  button, a.button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button.primary, a.button.primary { background: var(--accent); color: #fff; }
  button.secondary { background: var(--secondary-bg); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: rgba(255, 59, 48, 0.12); color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status { font-size: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .status.ok { display: block; background: rgba(52, 199, 89, 0.12); color: #1f7a3d; }
  .status.err { display: block; background: rgba(255, 59, 48, 0.12); color: var(--danger); }
  .status.pending { display: block; background: var(--secondary-bg); color: var(--hint); }
  .account { font-size: 14px; color: var(--hint); }
  .hidden { display: none !important; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--secondary-bg); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Товари — завантаження без деплою</h1>
    <p class="hint">Встав JSON або JSONL зі скрапера (по одному товару на рядок) або завантаж файл — формат нормалізується автоматично, і сайт одразу підхопить нові дані.</p>
  </div>

  <section id="loginSection">
    <p>Потрібен вхід через Google-акаунт адміністратора.</p>
    <div id="loginStatus" class="status"></div>
    <div class="row">
      <a class="button primary" href="/api/auth/login">Увійти через Google</a>
    </div>
  </section>

  <section id="adminSection" class="hidden">
    <div class="row" style="justify-content: space-between;">
      <span class="account" id="accountEmail"></span>
      <button class="secondary" id="logout" type="button">Вийти</button>
    </div>
  </section>

  <section id="uploadSection" class="hidden">
    <label for="file">Файл products.json або products.jsonl</label>
    <input id="file" type="file" accept="application/json,.json,.jsonl,text/plain" />
    <label for="json">Або встав JSON вручну</label>
    <textarea id="json" placeholder="[ { &quot;id&quot;: &quot;...&quot;, &quot;name&quot;: &quot;...&quot;, ... } ]"></textarea>
    <div class="row">
      <button id="loadCurrent" class="secondary" type="button">Завантажити поточні товари</button>
      <button id="upload" class="primary" type="button">Залити на сайт</button>
    </div>
    <div id="status" class="status"></div>
  </section>
</main>

<script>
  const loginSection = document.getElementById('loginSection');
  const loginStatus = document.getElementById('loginStatus');
  const adminSection = document.getElementById('adminSection');
  const uploadSection = document.getElementById('uploadSection');
  const accountEmail = document.getElementById('accountEmail');
  const fileInput = document.getElementById('file');
  const jsonArea = document.getElementById('json');
  const statusEl = document.getElementById('status');
  const uploadBtn = document.getElementById('upload');
  const loadBtn = document.getElementById('loadCurrent');
  const logoutBtn = document.getElementById('logout');

  const ERROR_MESSAGES = {
    forbidden: 'Цей Google-акаунт не має доступу до адмінки.',
    invalid_state: 'Сесія входу застаріла, спробуй ще раз.',
    email_not_verified: 'Пошта Google-акаунта не підтверджена.',
    token_exchange_failed: 'Не вдалося завершити вхід через Google.',
  };

  function setStatus(el, kind, text) {
    el.className = 'status ' + kind;
    el.textContent = text;
  }

  function parseProductsPayload(text) {
    const trimmed = text.trim();
    if (!trimmed) throw new Error('Порожній ввід.');

    // Звичайний JSON: масив товарів або один товар
    try {
      const data = JSON.parse(trimmed);
      if (Array.isArray(data)) return data;
      if (data && typeof data === 'object') return [data];
    } catch {
      // не валідний як єдиний JSON — пробуємо JSONL нижче
    }

    // JSONL: один JSON-обʼєкт на рядок
    const lines = trimmed.split('\n').map((l) => l.trim()).filter(Boolean);
    const items = [];
    lines.forEach((line, i) => {
      try {
        items.push(JSON.parse(line));
      } catch {
        throw new Error(`Невалідний JSON у рядку ${i + 1}.`);
      }
    });
    if (items.length === 0) throw new Error('Не знайдено жодного товару.');
    return items;
  }

  const SALES = {
    nike: { name: 'Nike', url: 'https://www.nike.com/sale' },
    adidas: { name: 'Adidas', url: 'https://www.adidas.com/outlet' },
    puma: { name: 'Puma', url: 'https://eu.puma.com/uk/en/sports/sale' },
  };

  function normalizeProduct(raw, index) {
    if (!raw || typeof raw !== 'object') {
      throw new Error(`Товар №${index + 1}: не є обʼєктом.`);
    }

    // Вже в потрібному форматі — нічого не робимо
    if (typeof raw.id === 'string' && typeof raw.name === 'string' && typeof raw.price === 'number') {
      return raw;
    }

    // Сирий формат скрапера (product_id, title, colors[].pricing, ...)
    const id = raw.product_id || raw.id;
    if (!id) throw new Error(`Товар №${index + 1}: немає id/product_id.`);

    const rawColors = Array.isArray(raw.colors) ? raw.colors : [];
    const colors = rawColors.map((c, ci) => ({
      id: c.product_id || c.id || `${id}-${ci}`,
      name: c.name || c.product_id || `Варіант ${ci + 1}`,
      thumbnail: c.thumbnail || raw.thumbnail || '',
      images: Array.isArray(c.images) ? c.images : [],
      sizes: Array.isArray(c.sizes)
        ? c.sizes.filter((s) => s && s.available !== false).map((s) => (typeof s === 'string' ? s : s.size))
        : [],
    }));

    const firstPricing = (rawColors[0] && rawColors[0].pricing) || {};
    const allSizes = [...new Set(colors.flatMap((c) => c.sizes))];
    const saleId = raw.source || raw.saleId || '';
    const brand = SALES[saleId];

    return {
      id,
      name: raw.title || raw.name || id,
      description: raw.description || raw.title || '',
      price: firstPricing.sale_price ?? raw.price ?? 0,
      originalPrice: firstPricing.original_price ?? raw.originalPrice,
      categoryId: raw.category || raw.categoryId || 'other',
      saleId,
      sourceName: raw.sourceName || (brand && brand.name) || saleId,
      sourceUrl: raw.sourceUrl || (brand && brand.url) || '',
      productUrl: raw.url || raw.productUrl || '',
      image: (rawColors[0] && rawColors[0].thumbnail) || raw.image || '',
      sizes: allSizes,
      colors,
      featuredRank: raw.featuredRank ?? 0,
    };
  }

  async function checkSession() {
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    if (error) {
      setStatus(loginStatus, 'err', ERROR_MESSAGES[error] || ('Помилка входу: ' + error));
      history.replaceState(null, '', location.pathname);
    }

    try {
      const res = await fetch('/api/auth/me', { credentials: 'include' });
      if (!res.ok) throw new Error('unauthorized');
      const { email } = await res.json();
      loginSection.classList.add('hidden');
      adminSection.classList.remove('hidden');
      uploadSection.classList.remove('hidden');
      accountEmail.textContent = email;
    } catch {
      loginSection.classList.remove('hidden');
      adminSection.classList.add('hidden');
      uploadSection.classList.add('hidden');
    }
  }

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    checkSession();
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files?.[0];
    if (!file) return;
    jsonArea.value = await file.text();
  });

  loadBtn.addEventListener('click', async () => {
    setStatus(statusEl, 'pending', 'Завантаження...');
    try {
      const res = await fetch('/api/products', { cache: 'no-store', credentials: 'include' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      jsonArea.value = JSON.stringify(data, null, 2);
      setStatus(statusEl, 'ok', `Завантажено ${data.length} товар(ів).`);
    } catch (err) {
      setStatus(statusEl, 'err', 'Помилка: ' + err.message);
    }
  });

  uploadBtn.addEventListener('click', async () => {
    let parsed;
    try {
      parsed = parseProductsPayload(jsonArea.value).map(normalizeProduct);
    } catch (err) {
      setStatus(statusEl, 'err', err.message || 'Невалідний JSON.');
      return;
    }

    uploadBtn.disabled = true;
    setStatus(statusEl, 'pending', 'Заливаю...');
    try {
      const res = await fetch('/api/products', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(parsed),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      setStatus(statusEl, 'ok', `Готово! Залито ${body.count} товар(ів). Онови сайт, щоб побачити зміни.`);
    } catch (err) {
      setStatus(statusEl, 'err', 'Помилка: ' + err.message);
    } finally {
      uploadBtn.disabled = false;
    }
  });

  checkSession();
</script>
</body>
</html>
